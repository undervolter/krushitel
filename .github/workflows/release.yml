name: release

on:
  push:
    branches: [main]
    paths:
      - "krushitel/**"
      - ".github/workflows/release.yml"

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.compute.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute release tag
        id: compute
        run: |
          set -euo pipefail
          BASE=$(grep -oP 'appVersion\s*=\s*"\K[^"]+' krushitel/main.go)
          if [ -z "$BASE" ]; then
            echo "could not find appVersion in krushitel/main.go" >&2
            exit 1
          fi
          git fetch --tags --force
          LAST=$(git tag -l "v${BASE}.[0-9]*" | sed -E "s/^v${BASE}\.//" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          if [ -z "$LAST" ]; then
            NEXT=1
          else
            NEXT=$((LAST + 1))
          fi
          TAG="v${BASE}.$(printf '%02d' "$NEXT")"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "computed tag: $TAG"

  build:
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            label: windows-amd64
          - goos: windows
            goarch: arm64
            label: windows-arm64
          - goos: linux
            goarch: amd64
            label: linux-amd64
          - goos: linux
            goarch: arm64
            label: linux-arm64
          - goos: linux
            goarch: arm
            goarm: "7"
            label: linux-armv7
          - goos: darwin
            goarch: amd64
            label: darwin-amd64
          - goos: darwin
            goarch: arm64
            label: darwin-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: krushitel/go.mod

      - name: Build
        working-directory: krushitel
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm || '' }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          NAME="krushitel-${{ needs.tag.outputs.tag }}-${{ matrix.label }}"
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          mkdir -p ../dist
          go build -trimpath -ldflags="-s -w" -o "../dist/${NAME}${EXT}" .

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [tag, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: build-*
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.tag.outputs.tag }}"
          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --generate-notes \
            --target "${{ github.sha }}"
